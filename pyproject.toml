[project]
name = "syskit"
version = "0.1.0"
description = "Modern CLI toolkit for Arch Linux and Manjaro users"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ledutheo", email = "theoledu@muslim.com"}
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
syskit = "syskit.cli:app"

[project.urls]
Homepage = "https://github.com/ledutheo/syskit"
Repository = "https://github.com/ledutheo/syskit"
Issues = "https://github.com/ledutheo/syskit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syskit"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
